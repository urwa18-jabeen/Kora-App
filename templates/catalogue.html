{% extends 'base.html' %}{% block body %}<h2>📋 {{t('catalogue')}}</h2>
<form method="post" action="{{url_for('kora.catalogue_save')}}" enctype="multipart/form-data" class="card"><input type="hidden" name="id" value="{{e.id if e}}">
<label>{{t('pname')}}<input name="name" value="{{e.name if e}}" required></label><label>{{t('category')}}<select name="category">{% for c in CATS %}<option {{'selected' if e and e.category==c[0]}}>{{c[0]}}</option>{% endfor %}</select></label>
<label>{{t('descr')}}<textarea name="descr">{{e.descr if e}}</textarea></label><div class="row"><label>{{t('price')}}<input type="number" name="price" value="{{e.price if e}}" required></label><label>{{t('moq')}}<input type="number" name="moq" value="{{e.moq if e}}" required></label><label>{{t('stock')}}<input type="number" name="stock" value="{{e.stock if e}}" required></label></div>
<label>{{t('location')}}<input name="location" value="{{e.location if e}}"></label><label>{{t('specs')}}<input name="specs" value="{{e.specs if e}}"></label><label><input type="checkbox" name="custom" {{'checked' if e and e.custom}}> {{t('custom')}}</label><label>{{t('photo')}}<input type="file" name="photo" accept="image/*"></label><button>{{t('save')}}</button></form>
{% for p in prods %}<div class="card row"><img class="sm" src="{{url_for('kora.pimg',pid=p.id)}}"><div class="grow"><b>{{p.name}}</b><br><small>{{p.price|rs}} · MOQ {{p.moq}} · {{p.stock}}</small></div><a class="mini" href="{{url_for('kora.catalogue',edit=p.id)}}">✏️</a>
<form method="post" action="{{url_for('kora.catalogue_delete',pid=p.id)}}"><button class="mini alt">🗑</button></form></div>{% endfor %}{% endblock %}
