{% extends 'base.html' %}{% from '_m.html' import ocard with context %}{% block body %}<h2>{{t('orders')}}</h2>
<div class="chips"><a class="chip {{'on' if s is none}}" href="{{url_for('kora.orders')}}">{{t('all')}}</a>{% for i in range(8) %}<a class="chip s{{i}}" href="{{url_for('kora.orders',s=i)}}">{{status_name(i)}}</a>{% endfor %}</div>
{% for o in orders %}{{ocard(o)}}{% else %}<p>{{t('none')}}</p>{% endfor %}{% endblock %}
